<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý cơ điện và kho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1e293b;
      background: #f1f5f9;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px rgb(15 23 42 / 8%);
      z-index: 1;
    }
    .app-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .app-tabs {
      display: flex;
      gap: 8px;
    }
    .app-tab {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: transparent;
      color: #475569;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .app-tab:hover {
      background: #f1f5f9;
    }
    .app-tab[aria-selected="true"] {
      color: #fff;
      background: #047d4c;
      box-shadow: 0 1px 2px rgb(15 23 42 / 15%);
    }
    .app-tab[data-app="warehouse"][aria-selected="true"] {
      background: #0284c7;
    }
    .app-frame {
      display: block;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #f1f5f9;
    }
    .app-frame[hidden] {
      display: none;
    }
    @media (max-width: 520px) {
      .app-header {
        padding: 8px;
      }
      .app-title {
        font-size: 13px;
      }
      .app-tabs {
        gap: 4px;
      }
      .app-tab {
        padding: 8px;
        font-size: 11px;
      }
      .app-tab i {
        margin-right: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Quản lý cơ điện và kho</h1>
      <nav class="app-tabs" aria-label="Chọn ứng dụng">
        <button class="app-tab" data-app="maintenance" type="button" aria-selected="true">
          <i class="fa-solid fa-screwdriver-wrench"></i>Quản lý cơ điện
        </button>
        <button class="app-tab" data-app="warehouse" type="button" aria-selected="false">
          <i class="fa-solid fa-warehouse"></i>Kho
        </button>
      </nav>
    </header>
    <iframe id="maintenance-frame" class="app-frame" title="Quản lý cơ điện" src="quanlycodien.html"></iframe>
    <iframe id="warehouse-frame" class="app-frame" title="Kho" data-src="kho.html" hidden></iframe>
  </div>
  <script>
    const tabs = document.querySelectorAll('.app-tab');
    const frames = {
      maintenance: document.getElementById('maintenance-frame'),
      warehouse: document.getElementById('warehouse-frame')
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const selectedApp = tab.dataset.app;
        Object.entries(frames).forEach(([app, frame]) => {
          const isSelected = app === selectedApp;
          frame.hidden = !isSelected;
          if (isSelected && !frame.dataset.loaded) {
            frame.src = frame.dataset.src;
            frame.dataset.loaded = 'true';
          }
        });
        tabs.forEach(item => {
          item.setAttribute('aria-selected', String(item === tab));
        });
      });
    });
  </script>
</body>
</html>
